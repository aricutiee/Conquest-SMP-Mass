  toggle-off: "<yellow>Staff chat mode disabled."
restart:
  prompt-duration: "<yellow>Enter the restart countdown duration."
  scheduled: "<red>Restart scheduled by <staff> in <duration>."
  cancelled: "<yellow>Restart cancelled by <staff>."
  milestone: "<red>Restart in <remaining>."
lockdown:
  prompt-reason: "<yellow>Enter the lockdown reason."
  enabled: "<red>Server lockdown enabled by <staff>. Reason: <reason>"
  disabled: "<green>Server lockdown disabled by <staff>."
  kick: "<red>Server lockdown: <reason>"
  login: "<red>The server is locked down. Reason: <reason>"
