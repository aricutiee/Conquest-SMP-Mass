    clear-ender: "<red>[Punishment] <player>'s ender chest was cleared by <staff>."
reports:
  no-self: "<red>You cannot report yourself."
  cooldown: "<red>Please wait <remaining> seconds before reporting again."
  submitted: "<green>Your report was sent to staff."
  staff-notify: "<red>[Report] <reporter> reported <player>: <reason>"
rollbacks:
  prompt-player: "<yellow>Enter the player whose death snapshots you want to view."
announcement:
  prompt: "<yellow>Enter the announcement text."
  empty: "<red>Announcements cannot be empty."
grace:
  start: "<gold>Grace period started for <duration>. Damage, hunger, fire, and fall protection are active."
  stop: "<yellow>Grace period cancelled. All grace protections were removed."
  expired: "<yellow>Grace period ended. All grace protections were removed."
  blocked: "<red>PvP is disabled during the grace period."
  prompt-duration: "<yellow>Enter the grace period duration."
vanish:
  fake-leave: "<yellow><player> left the game"
  fake-join: "<yellow><player> joined the game"
  reminder: "<gray>You are vanished."
freeze:
  frozen: "<red>You are frozen. Do not disconnect."
  unfrozen: "<green>You are no longer frozen."
  command-blocked: "<red>You cannot use that command while frozen."
  disconnect-alert: "<red><player> disconnected while frozen."
notes:
  prompt: "<yellow>Enter a private staff note."
keyall:
  sent: "<green>Items sent to <count> online players."
  dropped: "<yellow>Some Key All items did not fit and were dropped at your feet."
chat:
