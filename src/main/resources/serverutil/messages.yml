  broadcast:
    warning: "<red>[Punishment] <player> was warned by <staff>. Reason: <reason>"
    temp-mute: "<red>[Punishment] <player> was muted for <duration> by <staff>. Reason: <reason>"
    mute: "<red>[Punishment] <player> was permanently muted by <staff>. Reason: <reason>"
    temp-ban: "<red>[Punishment] <player> was banned for <duration> by <staff>. Reason: <reason>"
    ban: "<red>[Punishment] <player> was permanently banned by <staff>. Reason: <reason>"
