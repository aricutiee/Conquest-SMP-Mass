no-permission: "<red>You do not have permission."
reload: "<green>ServerUtil reloaded."
player-not-found: "<red>That player is not known to this server yet."
chat-input:
  cancel-help: "<gray>Type <yellow>cancel <gray>to cancel."
  cancelled: "<yellow>Input cancelled."
  timeout: "<red>Input timed out."
punishments:
  prompt-player: "<yellow>Enter the target username or UUID."
  prompt-duration: "<yellow>Enter a duration, such as 30min, 1hr, or 1d12h30m."
  prompt-reason: "<yellow>Enter a reason. Leave blank for the configured default."
  protected: "<red>That player is protected."
  ban-kick: "<red>You were banned. Reason: <reason>"
  login-ban: "<red>You are banned. Reason: <reason>"
