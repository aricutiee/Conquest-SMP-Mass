roll:
  duration-seconds: 5
  frames: 24
  join-delay-ticks: 20
  tick-sound: minecraft:block.note_block.harp
  tick-volume: 0.65
  tick-pitch-start: 1.8
  tick-pitch-end: 0.7
  reveal-sound: minecraft:entity.ender_dragon.growl
  reveal-volume: 0.4
  reveal-pitch: 1.0
  spinning-subtitle: <gray>Discovering your race...
  result-subtitle: <gold>Your origin has awakened.
  preview-subtitle: '<yellow>Preview only: your race will not change'
  preview-result-subtitle: '<yellow>Preview complete: your saved race is unchanged'
  weights:
    bogborn: 1
    rootbound: 1
    petalfolk: 1
    hollow-eyed: 1
    dwarf: 1
  colors:
    bogborn: '#60c98b'
    rootbound: '#c19a6b'
    petalfolk: '#ffa7cf'
    hollow-eyed: '#d8e3dd'
    dwarf: '#f2aa50'
combat:
  minimum-attack-charge: 0.9
  base-hits: 3
  base-chain-timeout-seconds: 8
  offensive-cooldown-seconds: 10
  action-bar: true
checks:
  passive-interval-ticks: 5
  potion-lease-ticks: 600
messages:
  roll-busy: <yellow>Your race roll is already pending or playing.
  roll-unavailable: <yellow>You can roll after respawning.
  roll-save-failed: <red>Your race could not be saved. Ask an administrator to check storage, then use /race to retry.
  selected: <green>Your base race is now <race>.
  locked: <yellow>Your choice is saved. An administrator can change it. Use /race info.
  no-permission: <red>You do not have permission.
  player-only: <red>This command is for players.
  player-not-found: <red>Player not found. Use an online name, a previously seen name, or a UUID.
  invalid-race: <red>Choose bogborn, rootbound, petalfolk, hollow-eyed, or dwarf.
  reset: <yellow>The saved base race was reset. A new roll will begin. Cooldowns were retained.
  reloaded: <green>Conquest race configuration reloaded.
  reload-failed: <red>Configuration was rejected. See the server log. Previous settings remain active.
  returned: <gray>The ancient power recedes. Your base race returns.
  none: Unchosen
  info-heading: '<gold>Active race: <race>'
  info-base: '<gray>Saved base race: <race>'
  action-bar: <gray><race> <dark_gray>| <gray>Chain <count> <dark_gray>| <gray>Offense <offense>s <dark_gray>| <gray>Defense <defense>s
bogborn:
  icon: LILY_PAD
  description:
  - '<green>Offense class: Venom Raider'
  - <gray>Melee hits deal 10% more damage before armor.
  - <gray>Every third charged hit poisons for 3s, 10s cooldown.
  - '<gray>Water Breathing underwater. Water guard: 30% reduction, 20s cooldown.'
  defense-reduction: 0.3
  defense-cooldown-seconds: 20
  poison-seconds: 3
  visual:
    particles:
    - HAPPY_VILLAGER
    - BUBBLE
    count: 4
    block: MUD
    sound: minecraft:entity.frog.ambient
    volume: 0.25
    pitch: 0.8
  damage-multiplier: 1.1
rootbound:
  icon: MANGROVE_ROOTS
  description:
  - '<green>Defense class: Root Guardian'
  - <gray>Always takes 10% less melee/projectile damage.
  - <gray>Guard adds 15% reduction and 75% less knockback, 20s cooldown.
  - <gray>Every third charged hit slows for 2.25s, 10s cooldown.
  passive-blocks:
  - MUD
  - MANGROVE_ROOTS
  - MUDDY_MANGROVE_ROOTS
  defense-blocks:
  - MUD
  - DIRT
  - COARSE_DIRT
  - ROOTED_DIRT
  - MANGROVE_ROOTS
  - MUDDY_MANGROVE_ROOTS
  defense-reduction: 0.15
  knockback-reduction: 0.75
  defense-cooldown-seconds: 20
  slowness-seconds: 2.25
  visual:
    particles:
    - BLOCK
    count: 8
    block: MANGROVE_ROOTS
    sound: minecraft:block.muddy_mangrove_roots.step
    volume: 0.35
    pitch: 0.8
  passive-reduction: 0.1
petalfolk:
  icon: CHERRY_SAPLING
  description:
  - '<light_purple>Healing class: Bloomkeeper'
  - <gray>Natural food regeneration restores 50% more health.
  - <gray>Every third charged hit heals 0.75 hearts, 10s cooldown.
  - <gray>Absorption I for 6s after surviving a hit, 24s cooldown.
  - <gray>30% less fall damage.
  fall-reduction: 0.3
  absorption-seconds: 6
  defense-cooldown-seconds: 24
  healing: 1.5
  visual:
    particles:
    - CHERRY_LEAVES
    count: 5
    block: CHERRY_LEAVES
    sound: minecraft:block.amethyst_block.chime
    volume: 0.25
    pitch: 1.3
  natural-healing-multiplier: 1.5
hollow-eyed:
  icon: PALE_OAK_SAPLING
  description:
  - '<light_purple>Movement class: Shadow Runner'
  - <gray>Permanent Speed I; Night Vision in low light.
  - <gray>Every third charged hit applies Darkness for 1.5s, 10s cooldown.
  - '<gray>Low-light guard: 30% less melee/projectile damage, 20s cooldown.'
  light-threshold: 7
  light-debounce-ticks: 10
  defense-reduction: 0.3
  defense-cooldown-seconds: 20
  darkness-seconds: 1.5
  visual:
    particles:
    - BLOCK
    - SMOKE
    count: 4
    block: PALE_OAK_WOOD
    sound: minecraft:entity.creaking.ambient
    volume: 0.2
    pitch: 0.8
dwarf:
  icon: POINTED_DRIPSTONE
  description:
  - '<gold>Passive utility class: Deepforged'
  - <gray>Permanent Haste I, above and below ground.
  - <gray>Stone/deepslate landings prevent up to 6 hearts, 24s cooldown.
  - <gray>Every third charged hit adds 0.75 hearts before armor, 10s cooldown.
  underground-height: 40
  landing-blocks:
  - STONE
  - DEEPSLATE
  fall-prevention: 12
  defense-cooldown-seconds: 24
  bonus-damage: 1.5
  visual:
    particles:
    - BLOCK
    count: 7
    block: DRIPSTONE_BLOCK
    sound: minecraft:block.stone.hit
    volume: 0.3
    pitch: 0.7
dragonborn:
  description:
  - <light_purple>Temporary Dragon Egg transformation
  - <gray>Activates with a Dragon Egg anywhere in your player inventory.
  - <gray>Four extra maximum hearts, Strength I, Speed I, Fire Resistance.
  - '<gray>Rising Fury: normal, normal, normal +2, 8, 10, 12, then +2 per hit.'
  - <gray>Changing targets or a 4s gap resets the chain.
  extra-max-health: 8
  chain-timeout-seconds: 4
  third-hit-bonus: 2
  replacement-start-hit: 4
  damage-per-hit-number: 2
  message-interval-ticks: 16
  transformation-messages:
  - <light_purple>You feel yourself changing.
  - <light_purple>.
  - <light_purple>..
  - <light_purple>...
  - <light_purple>Something ancient wakes inside you.
  - <light_purple>You have become Dragonborn.
  visual:
    particles:
    - PORTAL
    count: 12
    block: OBSIDIAN
    sound: minecraft:entity.ender_dragon.ambient
    volume: 0.15
    pitch: 0.8
class-balance-version: 1
